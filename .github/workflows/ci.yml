name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Same suite as `test`, split in two: each leg runs about half the test files.
  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/2

  # Fails when coverage drops below the thresholds in vitest.config.ts.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: vitest run --coverage
        # An explicit `shell: bash` adds -o pipefail, so tee keeps vitest's exit code.
        shell: bash
        run: npx vitest run --coverage 2>&1 | tee coverage.txt
      - name: Coverage table to the job summary
        if: always() && hashFiles('coverage.txt') != ''
        run: |
          {
            echo '### Coverage'
            echo '```text'
            sed -n '/Coverage report from/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # examples/coverage-trap: 100% coverage that is still wrong, the uncovered
  # lines table, and a threshold that fails. Each demo must exit as expected.
  coverage-trap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Run the three demos and check their exit codes
        run: |
          status=0
          for demo in coverage-100:0 coverage-gap:0 coverage-threshold:1; do
            name=${demo%:*}
            want=${demo#*:}
            got=0
            npm run -s "demo:$name" > "$name.txt" 2>&1 || got=$?
            # The threshold demo must fail for the threshold, not for any other reason.
            if [ "$name" = coverage-threshold ] && [ "$got" = 1 ] &&
              ! grep -q 'does not meet global threshold' "$name.txt"; then
              got="1 without the threshold error"
            fi
            cat "$name.txt"
            {
              echo "### npm run demo:$name (exit code $got, expected $want)"
              echo '```text'
              cat "$name.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$got" != "$want" ]; then
              echo "::error::demo:$name exited with $got, expected $want"
              status=1
            fi
          done
          exit "$status"

  # Playwright smoke test against the built API. The browser download is cached
  # by hand: key = OS + installed Playwright version, restore-keys = the prefix.
  # --with-deps runs on a hit too: the apt packages it installs are not cached.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload the HTML report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build

  # The one check the ruleset requires. Matrix legs ("test (22)", ...) and
  # renamed jobs come and go; this name stays. if: always() makes it report
  # even when a needed job failed or was skipped, so it never stays pending.
  ci-ok:
    needs: [lint, test, test-shard, coverage, coverage-trap, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        run: echo '${{ toJSON(needs.*.result) }}' | jq -e 'all(. == "success")'
