name: Docker lab

# Re-runs the Docker post's build-time and runtime experiments on a clean runner
# and keeps their raw output: job summary + one artifact per job. Not a required check.
on:
  workflow_dispatch:
  # Monthly re-run (day 1, 03:57 UTC): the logs and artifacts expire after 90 days.
  schedule:
    - cron: "57 3 1 * *"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "Dockerfile*"
      - ".dockerignore"
      - ".dive-ci"
      - "compose.yaml"
      - "src/server.ts"
      - ".github/workflows/docker-lab.yml"
  pull_request:
    paths:
      - "docker/**"
      - "Dockerfile*"
      - ".dockerignore"
      - ".dive-ci"
      - "compose.yaml"
      - "src/server.ts"
      - ".github/workflows/docker-lab.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Post 1.1 vs 1.2: one-line change, rebuild; naive re-runs npm install, ordered is CACHED.
  layer-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/layer-cache.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-layer-cache
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 1.3: build context size with and without .dockerignore, after npm ci.
  build-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash docker/lab/build-context.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-build-context
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 3: bcrypt on alpine, build from source without a toolchain, no shell in distroless.
  base-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/base-images.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-base-images
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 4: ARG token in the history vs secret mount; is the syntax directive required?
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/secrets.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-secrets
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 7: dive in CI mode on the production image, rules in .dive-ci.
  dive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/dive.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-dive
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 6: dev stack from compose.yaml, /healthz through compose, the API queries Postgres.
  compose-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/compose-up.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-compose-up
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 6.1: the bind mount hides node_modules; the anonymous volume brings it back.
  volume-trap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/volume-trap.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-volume-trap
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 8.1: whoami in the production container.
  non-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/non-root.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-non-root
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 8.2: time until HEALTHCHECK reports healthy.
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/healthcheck.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-healthcheck
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90

  # Post 8.3: docker stop on node vs npm start.
  graceful-shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash docker/lab/graceful-shutdown.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-graceful-shutdown
          path: ${{ runner.temp }}/lab-out/
          retention-days: 90
